plugins {
	// Javaプロジェクト用プラグイン
	id 'java'

	// Spring Boot アプリのビルド・実行・設定を簡単にする
	id 'org.springframework.boot' version '4.0.1'

	// Spring Boot 推奨の依存関係バージョンを管理
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		// Java 21 を使用
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		// Lombokなど、コンパイル時のみ必要な依存関係を
		// annotationProcessor からも参照できるようにする
		extendsFrom annotationProcessor
	}
}

repositories {
	// Maven Central リポジトリを使用
	mavenCentral()
}

dependencies {

	/* ===============================
	   Web（API / アプリケーション）
	   =============================== */

	// Spring MVC（同期型のWeb / REST API）
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// Spring WebFlux（非同期・リアクティブWeb）
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// ※ MVC と WebFlux を同時に使う場合は、
	//    基本は MVC が優先される（用途分離が前提）


	/* ===============================
	   セキュリティ・認証認可
	   =============================== */

	// Spring Security（認証・認可の基本機能）
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// OAuth2 / OpenID Connect クライアント
	// （Googleログインなどの外部認証）
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'


	/* ===============================
	   データベース・永続化
	   =============================== */

	// JPA（Hibernate）を使ったDBアクセス
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// MySQL JDBC ドライバ（実行時のみ必要）
	runtimeOnly 'com.mysql:mysql-connector-j'

	/* ===============================
		マイクロサービス・外部通信
		=============================== */

	// OpenFeign（HTTPクライアントをインターフェースで定義）
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'


	/* ===============================
	   開発効率向上
	   =============================== */

	// Lombok（getter/setter、constructor 自動生成）
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'


	/* ===============================
	   テスト関連
	   =============================== */

	// JPAのテスト（@DataJpaTest など）
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

	// OAuth2クライアントのテストサポート
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'

	// Spring Security のテスト用（@WithMockUser など）
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// WebFlux のテスト（WebTestClientなど）
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'

	// Spring MVC のテスト（MockMvcなど）
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// JUnit Platform ランチャー（IDE・CI向け）
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// JUnit 5（JUnit Platform）を使用
	useJUnitPlatform()
}
