# ============================================
# BFF Service - application.properties
# ポート: 8080
# ============================================

# サーバー設定
server.port=8080
spring.application.name=BFF

# ============================================
# データベース設定（MySQL）
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=bestyle
spring.datasource.password=bestyle123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always

# HikariCP接続プール
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============================================
# AWS Cognito設定
# ============================================
# Cognito User Pool（AWSコンソールで取得した値を設定）
cognito.user-pool-id=${COGNITO_USER_POOL_ID:ap-northeast-1_XXXXXXXXX}
cognito.client-id=${COGNITO_CLIENT_ID:your-client-id}
cognito.client-secret=${COGNITO_CLIENT_SECRET:your-client-secret}
cognito.region=${AWS_REGION:ap-northeast-1}

# OAuth2 Client設定
spring.security.oauth2.client.registration.cognito.client-id=${cognito.client-id}
spring.security.oauth2.client.registration.cognito.client-secret=${cognito.client-secret}
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/cognito
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.client-name=Cognito

# OAuth2 Provider設定
spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}
spring.security.oauth2.client.provider.cognito.user-name-attribute=cognito:username

# JWT Resource Server設定
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.${cognito.region}.amazonaws.com/${cognito.user-pool-id}/.well-known/jwks.json

# ============================================
# CORS設定
# ============================================
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ============================================
# マイクロサービス接続先（Feign Client）
# ============================================
services.user-service.url=http://localhost:8081
services.post-service.url=http://localhost:8082
services.follow-service.url=http://localhost:8083

# Feign Client設定
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000
spring.cloud.openfeign.client.config.default.logger-level=BASIC

# ============================================
# ログ設定
# ============================================
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG


# ============================================
# Actuator（ヘルスチェック）
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always