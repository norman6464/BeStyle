# ============================================
# BFF Service - application.properties
# ポート: 8080
# ============================================

# サーバー設定
server.port=8080
spring.application.name=BFF

# ============================================
# データベース設定（MySQL）
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo:jdbc:mysql://localhost:3305/bff_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bestyle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bestyle123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never

# HikariCP接続プール
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# ============================================
# AWS認証設定（IAMユーザー）
# ============================================
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION:ap-northeast-1}

# ============================================
# AWS Cognito設定
# ============================================
cognito.user-pool-id=${COGNITO_USER_POOL_ID}
cognito.client-id=${COGNITO_CLIENT_ID}
cognito.client-secret=${COGNITO_CLIENT_SECRET}
cognito.domain=${COGNITO_DOMAIN}

# フロントエンドのコールバックURI
cognito.redirect-uri=${COGNITO_REDIRECT_URI:http://localhost:5173/login/callback}

# Cognitoトークンエンドポイント
cognito.token-uri=${COGNITO_TOKEN_URI}

# CognitoのJWKセット（公開鍵）URI
cognito.jwk-set-uri=${COGNITO_JWK_SET_URI}

# ============================================
# セッション設定
# ============================================
session.cookie-name=${SESSION_COOKIE_NAME:BESTYLE_SESSION}
session.expiry-hours=${SESSION_EXPIRY_HOURS:24}

# ============================================
# CORS設定
# ============================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ============================================
# マイクロサービス接続先（Feign Client）
# ============================================
services.user.url=http://user:8080
services.post.url=http://post:8080
services.follow.url=http://follow:8080

# Feign Client設定
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000
spring.cloud.openfeign.client.config.default.logger-level=BASIC

# ============================================
# ログ設定
# ============================================
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG


# ============================================
# Actuator（ヘルスチェック）
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always