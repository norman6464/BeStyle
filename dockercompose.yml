# ============================================
# BeStyle - docker-compose.yml
# ローカル開発環境用（シンプル版）
# ============================================

services:
  # ============================================
  # データベース（MySQL）
  # ============================================
  
  # User Service用DB
  user-db:
    image: mysql:8.0
    container_name: bestyle-user-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: user_db
      MYSQL_USER: bestyle
      MYSQL_PASSWORD: bestyle123
    ports:
      - "3306:3306"
    volumes:
      - user-db-data:/var/lib/mysql
      - ./database/user-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

  # Post Service用DB
  post-db:
    image: mysql:8.0
    container_name: bestyle-post-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: post_db
      MYSQL_USER: bestyle
      MYSQL_PASSWORD: bestyle123
    ports:
      - "3307:3306"
    volumes:
      - post-db-data:/var/lib/mysql
      - ./database/post-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

  # Follow Service用DB
  follow-db:
    image: mysql:8.0
    container_name: bestyle-follow-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: follow_db
      MYSQL_USER: bestyle
      MYSQL_PASSWORD: bestyle123
    ports:
      - "3308:3306"
    volumes:
      - follow-db-data:/var/lib/mysql
      - ./database/follow-service/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

  # ============================================
  # Redis（キャッシュ・セッション）
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: bestyle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

# ============================================
# ボリューム（データ永続化）
# ============================================
volumes:
  user-db-data:
  post-db-data:
  follow-db-data:
  redis-data:

# ============================================
# ネットワーク
# ============================================
networks:
  bestyle-network:
    driver: bridge