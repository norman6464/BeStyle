# ============================================
# Post Service - application.properties
# ポート: 8082
# ============================================

# サーバー設定
server.port=8082
spring.application.name=post


# ============================================
# データベース設定（MySQL）
# 環境変数からの設定を優先（BFFに合わせる）
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo:jdbc:mysql://localhost:3307/post_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bestyle}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bestyle123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP接続プール
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false


# SQL初期化（初回のみ）
spring.sql.init.mode=always
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql

# ============================================
# Redis設定
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Redisセッション
spring.session.store-type=redis
spring.session.data.redis.namespace=bestyle:post

# Redisキャッシュ
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# ============================================
# 他サービス接続（Feign Client）
# ============================================
services.user-service.url=http://user:8080
services.follow-service.url=http://follow:8080

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# ============================================
# ログ設定
# ============================================
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.web=DEBUG

# ============================================
# Actuator（ヘルスチェック）
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always