# ============================================
# User Service - application.properties
# ポート: 8081
# ============================================

# サーバー設定
server.port=8080
spring.application.name=user

# ============================================
# データベース設定（MySQL）
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=bestyle
spring.datasource.password=bestyle123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP接続プール
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL初期化（初回のみ）
spring.sql.init.mode=always
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql

# ============================================
# Redis設定
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Redisセッション
spring.session.store-type=redis
spring.session.data.redis.namespace=bestyle:user

# Redisキャッシュ
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ============================================
# ログ設定
# ============================================
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.web=DEBUG

# ============================================
# Actuator（ヘルスチェック）
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always