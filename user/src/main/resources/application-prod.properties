# ============================================
# User Service - Production Profile
# ============================================

# サーバーポート（ECSでは全サービス8080で統一）
server.port=8080

# 本番用設定
logging.level.root=INFO
logging.level.com.example=INFO

# Hibernate DDL（本番では変更しない）
spring.jpa.hibernate.ddl-auto=none

# SQL初期化（本番では無効）
spring.sql.init.mode=never
