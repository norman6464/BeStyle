plugins {
	// Javaプロジェクト用プラグイン
	id 'java'

	// Spring Bootのビルド・実行・依存管理を簡単にする
	id 'org.springframework.boot' version '4.0.1'

	// Spring Bootと相性の良い依存関係管理を行う
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		// Java 21 を使用
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		// Lombokなど、コンパイル時のみ必要な依存関係を
		// annotationProcessor からも利用できるようにする
		extendsFrom annotationProcessor
	}
}

repositories {
	// Maven Central リポジトリを使用
	mavenCentral()
}

ext {
	// Spring Cloud の BOM バージョン定義
	set('springCloudVersion', "2025.1.0")
}

dependencies {

	/* ===============================
	   Spring Boot 基本機能
	   =============================== */

	// Spring MVC（REST API / Webアプリケーション用）
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// 入力値チェック（@NotNull などのバリデーション）
	implementation 'org.springframework.boot:spring-boot-starter-validation'


	/* ===============================
	   データベース・永続化
	   =============================== */

	// JPA（Hibernate）を使ったDBアクセス
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// MySQL JDBC ドライバ（実行時のみ必要）
	runtimeOnly 'com.mysql:mysql-connector-j'


	/* ===============================
	   Redis（セッション管理・キャッシュ）
	   =============================== */

	// Redis を使ったセッション管理
	implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'

	// Redis 操作用（キャッシュ・KeyValue操作など）
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'


	/* ===============================
	   マイクロサービス・外部通信
	   =============================== */

	// OpenFeign（HTTPクライアントをインターフェースで定義）
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'


	/* ===============================
	   開発効率向上
	   =============================== */

	// Lombok（getter/setter, constructor 自動生成）
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'


	/* ===============================
	   テスト関連
	   =============================== */

	// JPAテスト用（@DataJpaTest など）
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

	// バリデーションのテストサポート
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'

	// Spring MVC のテスト（MockMvcなど）
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// JUnit Platform のランチャー（IDE・CI向け）
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		// Spring Cloud の依存関係を一括管理（バージョン衝突防止）
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	// JUnit 5（JUnit Platform）を使用
	useJUnitPlatform()
}
