
# ============================================
# Follow Service - application.properties
# ポート: 8083
# ============================================

# サーバー設定
server.port=8083
spring.application.name=follow

# ============================================
# データベース設定（MySQL）
# ============================================
spring.datasource.url=jdbc:mysql://localhost:8889/follow_service_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP接続プール
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# schema.sqlの自動実行設定
spring.sql.init.mode=always

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# ============================================
# Redis設定
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Redisセッション
spring.session.store-type=redis
spring.session.data.redis.namespace=bestyle:follow

# Redisキャッシュ
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# ============================================
# 他サービス接続（Feign Client）
# ============================================
services.user-service.url=http://localhost:8081

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# ============================================
# ログ設定
# ============================================
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.web=DEBUG
