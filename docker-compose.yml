# ============================================
# BeStyle - docker-compose.yml
# ローカル開発環境用（全サービス版）
# ============================================

services:
  # ============================================
  # データベース（MySQL）
  # ============================================
  
  # BFF Service用DB
  bff-db:
    image: mysql:8.0
    container_name: bestyle-bff-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bff_db
      MYSQL_USER: bestyle
      MYSQL_PASSWORD: bestyle123
    ports:
      - "3305:3306"
    volumes:
      - bff-db-data:/var/lib/mysql
      - ./BFF/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network
  
  # User Service用DB
  user-db:
    image: mysql:8.0
    container_name: bestyle-user-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: user_db
      MYSQL_USER: bestyle
      MYSQL_PASSWORD: bestyle123
    ports:
      - "3306:3306"
    volumes:
      - user-db-data:/var/lib/mysql
      - ./user/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

  # Post Service用DB
  post-db:
    image: mysql:8.0
    container_name: bestyle-post-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: post_db
      MYSQL_USER: bestyle
      MYSQL_PASSWORD: bestyle123
    ports:
      - "3307:3306"
    volumes:
      - post-db-data:/var/lib/mysql
      - ./post/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

  # Follow Service用DB
  follow-db:
    image: mysql:8.0
    container_name: bestyle-follow-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: follow_db
      MYSQL_USER: bestyle
      MYSQL_PASSWORD: bestyle123
    ports:
      - "3308:3306"
    volumes:
      - follow-db-data:/var/lib/mysql
      - ./follow/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

  # ============================================
  # Redis（キャッシュ・セッション）
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: bestyle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bestyle-network

  # ============================================
  # アプリケーションサービス
  # ============================================

  # BFF Service
  bff:
    build:
      context: ./BFF
    container_name: bestyle-bff
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://bff-db:3306/bff_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=bestyle
      - SPRING_DATASOURCE_PASSWORD=bestyle123
      - SPRING_DATA_REDIS_HOST=redis
      - SERVICES_USER_URL=http://user-service:8081
      - SERVICES_POST_URL=http://post-service:8082
      - SERVICES_FOLLOW_URL=http://follow-service:8083
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      bff-db:
        condition: service_healthy
      user-service:
        condition: service_started
      post-service:
        condition: service_started
      follow-service:
        condition: service_started
    networks:
      - bestyle-network

  # User Service
  user-service:
    build:
      context: ./user
    container_name: bestyle-user-service
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://user-db:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=bestyle
      - SPRING_DATASOURCE_PASSWORD=bestyle123
      - SPRING_DATA_REDIS_HOST=redis
    ports:
      - "8081:8081"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bestyle-network

  # Post Service
  post-service:
    build:
      context: ./post
    container_name: bestyle-post-service
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://post-db:3306/post_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=bestyle
      - SPRING_DATASOURCE_PASSWORD=bestyle123
      - SPRING_DATA_REDIS_HOST=redis
      - SERVICES_USER_SERVICE_URL=http://user-service:8081
      - SERVICES_FOLLOW_SERVICE_URL=http://follow-service:8083
    ports:
      - "8082:8082"
    depends_on:
      post-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bestyle-network

  # Follow Service
  follow-service:
    build:
      context: ./follow
    container_name: bestyle-follow-service
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://follow-db:3306/follow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=bestyle
      - SPRING_DATASOURCE_PASSWORD=bestyle123
      - SPRING_DATA_REDIS_HOST=redis
      - SERVICES_USER_SERVICE_URL=http://user-service:8081
    ports:
      - "8083:8083"
    depends_on:
      follow-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bestyle-network

# ============================================
# ボリューム（データ永続化）
# ============================================
volumes:
  bff-db-data:
  user-db-data:
  post-db-data:
  follow-db-data:
  redis-data:

# ============================================
# ネットワーク
# ============================================
networks:
  bestyle-network:
    driver: bridge